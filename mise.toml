# Override .config/mise.toml, which is regenerated from measles.

[env]
INSH_TF = 'tofu'

[tools]
opentofu = '1.10.6'

[tasks.deploy]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
envi=${1:?Usage: mise deploy ENVI}
mise tinit rivertide
tf=${INSH_TF:-terraform}
"$tf" -chdir=deploys/rivertide/terraform workspace select -or-create "$envi"
TF_VAR_giha=$(mise giha) TF_VAR_tabr=$(mise tabr) TF_WORKSPACE="$envi" \
    "$tf" -chdir=deploys/rivertide/terraform apply "$@"
'''
